services:
  - type: web
    name: laravel-app
    runtime: docker
    plan: free
    env: docker
    buildCommand: |
      docker build -t laravel-app .
      docker run --rm -v $(pwd):/var/www/html laravel-app /bin/bash -c "./build.sh"
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: cashworx_ovsp
          property: host
      - key: DB_DATABASE
        fromDatabase:
          name: cashworx_ovsp
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cashworx_ovsp
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cashworx_ovsp
          property: password